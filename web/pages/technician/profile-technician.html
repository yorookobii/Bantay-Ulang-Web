<!DOCTYPE html>
<html lang="en" data-role="technician">
    <head>
        <meta charset="UTF-8">
        <script src="../shared/js/role-guard-head.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Profile - Bantay Ulang</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="../shared/css/settings.css">
        <link rel="stylesheet" href="../shared/css/profileMenu.css">
        <link rel="stylesheet" href="../shared/css/profile.css">
        <script>try{if(localStorage.getItem('sidebar-collapsed')==='1')document.documentElement.classList.add('sidebar-init-collapsed')}catch(e){}</script>
    </head>
    <body>
        <div class="app">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo-row">
                        <div class="logo-droplets">
                            <img src="../../assets/img/logo-one.png" alt="Bantay Ulang" class="logo-img">
                        </div>
                        <span class="logo-text">Bantay Ulang</span>
                        <button type="button" class="sidebar-toggle" id="sidebarToggleBtn" aria-label="Close menu">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                <ul class="sidebar-menu">
                    <li><a href="dashboard-technician.html" title="Dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                    <li><a href="task-technician.html" title="My Tasks"><i class="fa-solid fa-clipboard-list"></i><span>My Tasks</span></a></li>
                </ul>
                <div class="sidebar-footer">
                    <button type="button" class="sidebar-logout-btn" id="sidebar-logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log Out</span>
                    </button>
                </div>
            </aside>

            <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

            <!-- Topbar -->
            <header class="topbar">
                <button type="button" class="topbar-menu-btn" id="topbarMenuBtn" aria-label="Open menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="topbar-right">
                    <div class="notification-container">
                        <div class="notification-icon" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
                            <i class="fa-regular fa-bell" aria-hidden="true"></i>
                            <span class="notification-badge"></span>
                        </div>
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-item"><i class="fa-solid fa-book-open-reader"></i> New report submitted</div>
                            <div class="notification-item"><i class="fa-solid fa-user"></i> New user registration</div>
                            <div class="notification-item"><i class="fa-solid fa-sync-alt"></i> System update available</div>
                        </div>
                    </div>
                    <div class="pm-wrap">
                        <button type="button" class="pm-trigger" aria-haspopup="menu" aria-expanded="false">
                            <span class="pm-text">
                                <span class="pm-name"></span>
                                <span class="pm-role"></span>
                            </span>
                            <span class="pm-avatar"><span></span></span>
                            <svg class="pm-indicator" viewBox="0 0 10 26" aria-hidden="true" focusable="false">
                                <path d="M2 2 C 9 8, 9 18, 2 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <script src="../shared/js/user-cache-paint.js"></script>

            <!-- Main Content -->
            <main class="content" style="padding: 24px 30px;">
                <div class="settings_headings" style="margin-bottom: 24px;">
                    <h2>My Profile</h2>
                    <p>Update your display name and view your account details.</p>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar-row">
                        <div class="profile-avatar-circle" id="profileAvatarCircle">A</div>
                        <div>
                            <div class="profile-avatar-label" id="profileDisplayName">Loading…</div>
                            <div class="profile-avatar-sublabel" id="profileDisplayRole"></div>
                        </div>
                    </div>

                    <form class="profile-form" id="profile-form" novalidate>
                        <div class="form-group">
                            <label for="profile-fullname">Full Name</label>
                            <input type="text" id="profile-fullname" name="fullName"
                                   placeholder="Enter your full name" required autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label for="profile-email">Email Address</label>
                            <input type="email" id="profile-email" name="email"
                                   placeholder="—" readonly>
                        </div>
                        <div class="form-group">
                            <label for="profile-role">Role</label>
                            <input type="text" id="profile-role" name="role"
                                   placeholder="—" readonly>
                        </div>

                        <button type="submit" class="btn-save-profile" id="profile-save-btn">
                            <i class="fa-solid fa-check"></i> Save Changes
                        </button>
                        <p class="profile-msg" id="profile-msg"></p>
                    </form>
                </div>
            </main>
        </div>

        <script type="module" src="../shared/js/profile.js"></script>
        <script type="module">
            import { requireRole } from '../shared/js/roleGuard.js';
            requireRole('technician');
        </script>
        <script type="module">
            import { loadUserProfile } from '../shared/js/userProfile.js';
            loadUserProfile();
        </script>
        <script type="module">
            import { initDropdown } from '../shared/js/dropdownActions.js';
            initDropdown();
        </script>
    </body>
</html>
