<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/users.css">
    <link rel="stylesheet" href="css/profileMenu.css">
    <script>try{if(localStorage.getItem('sidebar-collapsed')==='1')document.documentElement.classList.add('sidebar-init-collapsed')}catch(e){}</script>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-row">
                    <div class="logo-droplets">
                        <img src="../../assets/img/logo-one.png" alt="Bantay Ulang" class="logo-img">
                    </div>
                    <span class="logo-text">Bantay Ulang</span>

                    <button type="button" class="sidebar-toggle" id="sidebarToggleBtn" aria-label="Collapse sidebar"><i
                            class="fa-solid fa-chevron-left"></i></button>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" title="Dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
                </li>
                <li><a href="real-time-monitoring.html" title="Readings"><i
                            class="fa-solid fa-chart-line"></i><span>Readings</span></a></li>
                <li><a href="automation.html" title="Automation"><i
                            class="fa-solid fa-bolt"></i><span>Automation</span></a></li>
                <li><a href="analytics.html" title="Analytics"><i
                            class="fa-solid fa-square-poll-vertical"></i><span>Analytics</span></a></li>
                <li><a href="history.html" title="History"><i
                            class="fa-solid fa-clock-rotate-left"></i><span>History</span></a></li>
                <li><a href="users.html" class="active" title="Users"><i
                            class="fa-solid fa-users"></i><span>Users</span></a></li>
                <li><a href="assign-actions.html" title="Assign Tasks"><i
                            class="fa-solid fa-clipboard-list"></i><span>Assign Tasks</span></a></li>
                <li><a href="settings.html" title="Settings"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button type="button" class="sidebar-logout-btn" id="sidebar-logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

        <!-- Topbar -->
        <header class="topbar">
            <button type="button" class="topbar-menu-btn" id="topbarMenuBtn" aria-label="Open menu"><i
                    class="fa-solid fa-bars"></i></button>

            <!-- Right Side Items -->
            <div class="topbar-right">
                <div class="notification-container">
                    <div class="notification-icon" onclick="toggleNotification()">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notification-badge"></span>
                    </div>
                    <div class="notification-dropdown" id="notificationDropdown">
                        <div class="notification-item"><i class="fa-solid fa-book-open-reader"></i> New report submitted
                        </div>
                        <div class="notification-item"><i class="fa-solid fa-user"></i> New user registration</div>
                        <div class="notification-item"><i class="fa-solid fa-sync-alt"></i> System update available
                        </div>
                    </div>
                </div>
                <div class="pm-wrap">
                    <button type="button" class="pm-trigger" aria-haspopup="menu" aria-expanded="false">
                        <span class="pm-text">
                            <span class="pm-name"></span>
                            <span class="pm-role"></span>
                        </span>
                        <span class="pm-avatar"><span></span></span>
                        <svg class="pm-indicator" viewBox="0 0 10 26" aria-hidden="true" focusable="false">
                            <path d="M2 2 C 9 8, 9 18, 2 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <script src="js/user-cache-paint.js"></script>

        <!-- Main Content -->
        <main class="content">

            <div class="user_headings">
                <h2>User Management</h2>
                <p>Control system access and permissions for your team.</p>
            </div>

            <div id="users-loading" class="um-loading">
                <div class="um-spinner"></div>
                <p>Loading users...</p>
            </div>

            <div id="users-container"></div>

        </main>
    </div>

    <script type="module" src="js/users.js"></script>
    <script type="module" src="../../assets/js/firebase-init.js"></script>
    <script type="module">
        import { loadUserProfile } from './js/userProfile.js';
        loadUserProfile();
    </script>
    <script type="module">
        import { initDropdown } from './js/dropdownActions.js';
        initDropdown({ handleToggle: false });
    </script>
</body>

</html>
