<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <title>All Alerts - Bantay Ulang Bulacan</title>
        <link rel="stylesheet" href="css/shell.css">
        <link rel="stylesheet" href="css/all-alerts.css">
        <link rel="stylesheet" href="css/profileMenu.css">
        <script>try{if(localStorage.getItem('sidebar-collapsed')==='1')document.documentElement.classList.add('sidebar-init-collapsed')}catch(e){}</script>
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo-row">
                        <div class="logo-droplets">
                            <img src="../../assets/img/logo-one.png" alt="Bantay Ulang" class="logo-img">
                        </div>
                        <span class="logo-text">Bantay Ulang</span>
                        <button type="button" class="sidebar-toggle" id="sidebarToggleBtn" aria-label="Collapse sidebar"><i class="fa-solid fa-chevron-left"></i></button>
                    </div>
                </div>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html" title="Dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                    <li><a href="real-time-monitoring.html" title="Readings"><i class="fa-solid fa-chart-line"></i><span>Readings</span></a></li>
                    <li><a href="automation.html" title="Automation"><i class="fa-solid fa-bolt"></i><span>Automation</span></a></li>
                    <li><a href="analytics.html" title="Analytics"><i class="fa-solid fa-square-poll-vertical"></i><span>Analytics</span></a></li>
                    <li><a href="history.html" title="History"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a></li>
                    <li><a href="users.html" title="Users"><i class="fa-solid fa-users"></i><span>Users</span></a></li>
                    <li><a href="assign-actions.html" title="Assign Tasks"><i class="fa-solid fa-clipboard-list"></i><span>Assign Tasks</span></a></li>
                    <li><a href="settings.html" title="Settings"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
                </ul>
                <div class="sidebar-footer">
                    <button type="button" class="sidebar-logout-btn" id="sidebar-logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log Out</span>
                    </button>
                </div>
            </aside>

            <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

            <header class="topbar">
                <button type="button" class="topbar-menu-btn" id="topbarMenuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>

                <div class="topbar-right">
                    <div class="notification-container">
                        <div class="notification-icon">
                            <i class="fa-regular fa-bell"></i>
                            <span class="notification-badge"></span>
                        </div>
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-item"><i class="fa-solid fa-book-open-reader"></i> New report submitted</div>
                            <div class="notification-item"><i class="fa-solid fa-user"></i> New user registration</div>
                            <div class="notification-item"><i class="fa-solid fa-sync-alt"></i> System update available</div>
                        </div>
                    </div>
                    <div class="pm-wrap">
                        <button type="button" class="pm-trigger" aria-haspopup="menu" aria-expanded="false">
                            <span class="pm-text">
                                <span class="pm-name"></span>
                                <span class="pm-role"></span>
                            </span>
                            <span class="pm-avatar"><span></span></span>
                            <svg class="pm-indicator" viewBox="0 0 10 26" aria-hidden="true" focusable="false">
                                <path d="M2 2 C 9 8, 9 18, 2 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <script src="js/user-cache-paint.js"></script>

            <main class="content">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="dashboard.html">Dashboard</a>
                    <span class="breadcrumb-sep" aria-hidden="true">›</span>
                    <span class="breadcrumb-current" aria-current="page">All Alerts</span>
                </nav>
                <header class="page-header">
                    <div class="page-title-block">
                        <h1>All Alerts</h1>
                        <p>Every active alert across your monitored parameters, grouped by severity.</p>
                    </div>
                </header>

                <div id="alerts-groups"></div>
            </main>
        </div>

        <script type="module" src="js/allAlerts.js"></script>
        <script type="module">
            import { loadUserProfile } from './js/userProfile.js';
            loadUserProfile();
        </script>
        <script type="module">
            import { initDropdown } from './js/dropdownActions.js';
            initDropdown();
        </script>
    </body>
</html>
